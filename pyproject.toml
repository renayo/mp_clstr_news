[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mpclstr"
version = "0.3.0"
description = "Pipeline for the pre-registered second study of minor-planet namesakes in the news"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "pyyaml>=6.0", "requests>=2.31"]

[project.optional-dependencies]
classify = ["torch", "transformers>=4.40"]
test = ["pytest>=7.4"]

[tool.setuptools]
packages = ["mpclstr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
