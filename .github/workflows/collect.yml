name: daily-collect

# Runs the registered daily pull at 12:00 UTC (PREREGISTRATION.md §4). The API key
# lives only in the repository secret CLSTR_API_KEY. The workflow commits the day's
# manifest, census pages, matched-cluster metadata and derived tables, and stores the
# complete raw archive of the day as a workflow artifact for transfer to object storage.

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Pull date (UTC, YYYY-MM-DD); default today"
        required: false

permissions:
  contents: write       # the collector commits manifests and derived tables; nothing else is granted

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect
        env:
          CLSTR_API_KEY: ${{ secrets.CLSTR_API_KEY }}
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(date -u +%F); fi
          echo "pull date $DATE"
          python -m mpclstr.collect --date "$DATE" || echo "collector reported an incomplete day"
          python -m mpclstr.derive

      # Workflow artifacts of a public repository can be downloaded by anyone with a GitHub
      # account, and the raw responses contain text that is not cleared for publication
      # (PREREGISTRATION.md §11). They are therefore encrypted before upload; without the
      # passphrase secret, nothing is uploaded.
      - name: Encrypt the day's raw responses (needs RAW_ARCHIVE_PASSPHRASE)
        env:
          RAW_ARCHIVE_PASSPHRASE: ${{ secrets.RAW_ARCHIVE_PASSPHRASE }}
        run: |
          if [ -n "$RAW_ARCHIVE_PASSPHRASE" ]; then
            tar czf - raw | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
              -pass env:RAW_ARCHIVE_PASSPHRASE -out "raw-$(date -u +%F).tar.gz.enc"
            ls -l raw-*.tar.gz.enc
          else
            echo "RAW_ARCHIVE_PASSPHRASE not set; raw responses are not uploaded as an artifact"
          fi

      - name: Keep the encrypted archive as a workflow artifact (90 days)
        uses: actions/upload-artifact@v4
        with:
          name: raw-${{ github.run_id }}
          path: raw-*.tar.gz.enc
          retention-days: 90
          if-no-files-found: ignore

      - name: Copy raw responses to object storage (optional; set RAW_S3_BUCKET, AWS_* secrets)
        env:
          RAW_S3_BUCKET: ${{ secrets.RAW_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
        run: |
          if [ -n "$RAW_S3_BUCKET" ]; then
            pip install awscli >/dev/null
            aws s3 sync raw "s3://$RAW_S3_BUCKET/raw" --no-progress
          else
            echo "RAW_S3_BUCKET not set; raw archive kept only as the workflow artifact"
          fi

      - name: Commit manifests and derived tables
        run: |
          git config user.name "mp-clstr-collector"
          git config user.email "collector@users.noreply.github.com"
          # committed: manifests (hashes of every raw file), derived tables, matched-cluster metadata.
          # raw/ is archived outside the repository (PREREGISTRATION.md §4.7).
          git add manifests derived
          git commit -m "collect $(date -u +%F)" || echo "nothing to commit"
          git push
